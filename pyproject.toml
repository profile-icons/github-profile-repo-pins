[project]
name = "github-profile-repo-pins"
version = "1.0.0"
description = "Generate configurable public/private repository pin visualizations for GitHub user & organization profiles with themes, translations, and contribution statistics."
authors = [
  { name = "profile-icons" },
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "lingua-language-detector~=2.2.0",
  "optimum-onnx[onnxruntime]~=0.0.3",
  "transformers>=4.50,<5",
  "sentencepiece~=0.2.2",
  "requests~=2.34.2",
  "cairosvg~=2.9.0",
  "Pillow~=12.2.0",
  "torch~=2.13.0",
]

[project.urls]
Homepage = "https://github.com/profile-icons/github-profile-repo-pins"
Repository = "https://github.com/profile-icons/github-profile-repo-pins.git"
Issues = "https://github.com/profile-icons/github-profile-repo-pins/issues"

[project.optional-dependencies]
dev = [
  "black~=26.5.1",
  "mypy>=2.3.1",
  "ruff~=0.15.16",
]

[project.scripts]
code-verify = "utils.code_verify:main"

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "cairosvg",
    "optimum.onnxruntime",
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gh_profile_repo_pins*", "utils*"]
