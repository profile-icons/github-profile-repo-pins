name: setup-py
description: Reusable action for setting up a Python environment with pip pyproject.toml install

inputs:
  py-version:
    description: Python version
    default: '3.14'

runs:
  using: composite

  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.py-version }}

    - name: Install
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
