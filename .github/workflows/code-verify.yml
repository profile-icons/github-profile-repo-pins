name: code-verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run
        run: code-verify
