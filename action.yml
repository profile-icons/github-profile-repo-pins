name: "GitHub Profile Repo Pins"
description: "Generate configurable public/private repository pin visualizations for GitHub user & organization profiles."
author: "profile-icons"

branding:
  icon: "user"
  color: "blue"

inputs:
  gh_api_token:
    description: "GitHub PAT. Default: `secrets.GITHUB_TOKEN`. Non-default PAT required for private repos & org profiles."
    required: true
  gh_username:
    description: "GitHub username. Default: `github.repository_owner`. Non-default username required for org profiles."
    required: true
  theme:
    description: "Theme name. Default is `github_soft`. Find & add themes at: profile-icons/readme-repo-pins."
    required: false
  background_image:
    description: "Background image (URL or file path)."
    required: false
  repo_names_exclusive:
    description: "Exclusive list of repositories (owner/repo) pins are rendered only for, separated by commas."
    required: false
  is_contribution_stats:
    description: "Include user contribution statistics (percentage). True or False (empty). Default: `False`."
    required: false
  num_repo_pins:
    description: "Number of pins to render (capped at 100). Default is `6` or the number of `repo_names_exclusive`."
    required: false
  repo_pin_order:
    description: "The order of repo pins displayed. Default is `stargazer` count in descending order."
    required: false
  is_exclude_repos_owned:
    description: "Exclude owned repositories not pinned. True or False (empty). Overridden by `repo_names_exclusive`."
    required: false
  is_exclude_repos_contributed:
    description: "Exclude contributed repos not pinned. True or False (empty). Overridden by `repo_names_exclusive`."
    required: false
  is_i18n:
    description: "Support repository pin badge and description text translations for multiple i18n locales."
    required: false
  hf_token:
    description: "HuggingFace token to authenticate requests for faster downloading with higher rate limits."
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.gh_api_token }}
        fetch-depth: 0
        persist-credentials: true

    - name: Checkout src
      uses: actions/checkout@v7
      with:
        repository: profile-icons/readme-repo-pins
        ref: main
        path: readme-repo-pins
        token: ${{ inputs.gh_api_token }}
        fetch-depth: 1
        persist-credentials: false

    - name: Setup bin
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup-bin.sh" "$GITHUB_WORKSPACE/readme-repo-pins"

    - name: Cache
      if: ${{ contains(fromJSON('["true","1","yes","on"]'), inputs.is_i18n) }}
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/repo-pins-models
          ${{ runner.temp }}/repo-pins-onnx
        key: repo-pins-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('readme-repo-pins/src/translation/*.rs', 'readme-repo-pins/scripts/setup-onnx.sh') }}

    - name: Setup ONNX
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IS_TRANSLATE: ${{ inputs.is_i18n }}
      run: |
        case "${IS_TRANSLATE,,}" in
          true|1|yes|on) bash "$REPO_PINS_SRC_DIR/scripts/setup-onnx.sh" ;;
        esac

    - name: Run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_API_TOKEN: ${{ inputs.gh_api_token }}
        GH_USERNAME: ${{ inputs.gh_username || github.repository_owner }}
        GH_REPO_OWNER: ${{ github.repository_owner }}
        GH_REPO_NAME: ${{ github.repository }}
        THEME: ${{ inputs.theme }}
        BG_IMG: ${{ inputs.background_image }}
        NUM_REPO_PINS: ${{ inputs.num_repo_pins }}
        REPO_PIN_ORDER: ${{ inputs.repo_pin_order }}
        REPO_NAMES_EXCLUSIVE: ${{ inputs.repo_names_exclusive }}
        IS_EXCLUDE_REPOS_OWNED: ${{ inputs.is_exclude_repos_owned }}
        IS_EXCLUDE_REPOS_CONTRIBUTED: ${{ inputs.is_exclude_repos_contributed }}
        IS_CONTRIBUTION_STATS: ${{ inputs.is_contribution_stats }}
        IS_TRANSLATE: ${{ inputs.is_i18n }}
        HF_TOKEN: ${{ inputs.hf_token }}
        REPO_PINS_MODEL_CACHE: ${{ runner.temp }}/repo-pins-models
      run: |
        for variable in NUM_REPO_PINS REPO_PIN_ORDER; do
          if [[ -z "${!variable}" ]]; then unset "$variable"; fi
        done
        "$REPO_PINS_BIN" --themes "$REPO_PINS_SRC_DIR/files/themes.json"

    - name: Commit
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_USERNAME: ${{ inputs.gh_username || github.repository_owner }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "$REPO_PINS_SRC_DIR/scripts/commit.sh"
