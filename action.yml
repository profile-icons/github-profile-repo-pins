name: "GitHub Profile Repo Pins"
description: "Design & display any public & private repo pins for GitHub user & organization profiles with auto-translations, images, themes, dynamic ordering & optional stats support."
author: "profile-icons"

branding:
  icon: "user"
  color: "blue"

inputs:
  gh_api_token:
    description: "GitHub PAT. Default: `secrets.GITHUB_TOKEN`. Non-default PAT required for private repos & org profiles."
    required: true
  gh_username:
    description: "GitHub username. Default: `github.repository_owner`. Non-default username required for org profiles."
    required: true
  theme:
    description: "Theme name. Default is `github_soft`. Find & add themes at: profile-icons/readme-repo-pins."
    required: false
  background_image:
    description: "Background image (URL or file path)."
    required: false
  repo_names_exclusive:
    description: "Exclusive list of repositories (owner/repo) pins are rendered only for, separated by commas."
    required: false
  is_contribution_stats:
    description: "Include user contribution statistics (percentage). True or False (empty). Default: `False`."
    required: false
  num_repo_pins:
    description: "Number of pins to render (capped at 100). Default is `6` or the number of `repo_names_exclusive`."
    required: false
  repo_pin_order:
    description: "The order of repo pins displayed. Default is `stargazer` count in descending order."
    required: false
  is_exclude_repos_owned:
    description: "Exclude owned repositories not pinned. True or False (empty). Overridden by `repo_names_exclusive`."
    required: false
  is_exclude_repos_contributed:
    description: "Exclude contributed repos not pinned. True or False (empty). Overridden by `repo_names_exclusive`."
    required: false
  hf_token:
    description: "HuggingFace token to authenticate requests for faster downloading with higher rate limits."
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.gh_api_token }}
        fetch-depth: 0

    - name: Checkout src
      uses: actions/checkout@v7
      with:
        repository: profile-icons/readme-repo-pins-src
        ref: main
        path: readme-repo-pins-src
        fetch-depth: 1

    - name: Setup
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
      run: |
        python -m pip install --upgrade pip
        pip install -r readme-repo-pins-src/requirements.txt

    - name: Run
      shell: bash
      env:
        GH_API_TOKEN: ${{ inputs.gh_api_token }}
        GH_USERNAME: ${{ inputs.gh_username }}
        GH_REPO_OWNER: ${{ github.repository_owner }}
        GH_REPO_NAME: ${{ github.repository }}
        THEME: ${{ inputs.theme }}
        BG_IMG: ${{ inputs.background_image }}
        NUM_REPO_PINS: ${{ inputs.num_repo_pins }}
        REPO_PIN_ORDER: ${{ inputs.repo_pin_order }}
        REPO_NAMES_EXCLUSIVE: ${{ inputs.repo_names_exclusive }}
        IS_EXCLUDE_REPOS_OWNED: ${{ inputs.is_exclude_repos_owned }}
        IS_EXCLUDE_REPOS_CONTRIBUTED: ${{ inputs.is_exclude_repos_contributed }}
        IS_CONTRIBUTION_STATS: ${{ inputs.is_contribution_stats }}
        HF_TOKEN: ${{ inputs.hf_token }}
      run: |
        python readme-repo-pins-src/gh_profile_repo_pins.py

    - name: Config git
      shell: bash
      env:
        GH_USERNAME: ${{ inputs.gh_username }}
      run: |
        set -e
        : "${GH_USER_NAME:?GH_USER_NAME missing}"; : "${GH_USER_ID:?GH_USER_ID missing}"
        git config user.name "$GH_USER_NAME"
        git config user.email "${GH_USER_ID}+${GH_USERNAME}@users.noreply.github.com"

    - name: Save changes
      shell: bash
      run: |
        set -e
        git diff -- README.md profile/README.md > "$RUNNER_TEMP/readme.patch"

        rm -rf "$RUNNER_TEMP/repo_pin_imgs"
        mkdir -p "$RUNNER_TEMP/repo_pin_imgs"
        if [ -d repo_pin_imgs ]; then
          cp -a repo_pin_imgs/. "$RUNNER_TEMP/repo_pin_imgs/"
        fi

        for file in README.md profile/README.md; do
          if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
            git restore -- "$file"
          fi
        done
        git restore --staged --worktree -- repo_pin_imgs 2>/dev/null || true
        git clean -fd -- repo_pin_imgs

    - name: Checkout generated
      shell: bash
      run: |
        set -e
        git pull
        git checkout generated || git checkout -b generated

    - name: Commit generated
      shell: bash
      run: |
        set -e
        rm -rf repo_pin_imgs
        mkdir -p repo_pin_imgs
        cp -a "$RUNNER_TEMP/repo_pin_imgs/." repo_pin_imgs/

        git add -A -- repo_pin_imgs
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update profile repo pins" || true
          git push --set-upstream origin generated
        else
          echo "No changes to commit."
        fi

    - name: Checkout main
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -e
        git checkout "$DEFAULT_BRANCH"
        git pull --rebase origin "$DEFAULT_BRANCH"

        if [ -s "$RUNNER_TEMP/readme.patch" ]; then
          git apply "$RUNNER_TEMP/readme.patch"
        else
          echo "README patch is empty."
        fi

    - name: Commit main
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -e
        for file in README.md profile/README.md; do
          if [ -f "$file" ]; then
            git add -- "$file"
          fi
        done

        if ! git diff --cached --quiet; then
          git commit -m "Update README.md"
          for attempt in 1 2 3; do
            if git push origin "$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "Push failed #$attempt"
            git pull --rebase origin "$DEFAULT_BRANCH"
            sleep $(((RANDOM % 8) + 3))
          done
          echo "Push failed after retries" >&2
          exit 1
        else
          echo "No changes to commit."
        fi
